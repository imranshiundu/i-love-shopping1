# Gitleaks configuration — the security gate for the CI/CD pipeline.
#
# Everything not allowlisted here fails the pipeline when detected in the
# repository or its history. Each allowlisted pattern is an *intentional*
# development default, a documented placeholder, or — for the Safaricom
# entries — the public Daraja sandbox constants published in Safaricom's own
# documentation (shared by every Daraja tutorial; sandbox-only, no real
# money or customer data). Real credentials never belong in source control.

[extend]
useDefault = true

[allowlist]
description = "intentional dev defaults, documented placeholders, public sandbox constants"
paths = [
  # Template file: placeholder values only; real keys live in the gitignored .env
  '(^|/)\.env\.example$',
]
regexes = [
  # compose dev defaults for throwaway local runs
  'dev-access-secret-min-32-chars-long-for-test',
  'dev-refresh-secret-min-32-chars-long-for-test',
  # docs/templates telling users to paste their own keys
  'sk_test_your_key_here',
  'pk_test_your_key_here',
  'whsec_your_secret_here',
  'your-mpesa-consumer-key-here',
  'your-mpesa-consumer-secret-here',
  'your-mpesa-passkey-here',
  'change-me-generate-with-openssl-rand-hex-32-[a-z-]+',
  # payment harness scripts: the compose-documented RabbitMQ dev basic-auth
  # pair (gitleaks matches these against the extracted secret, not the line)
  'iloveshopping:iloveshopping',
  # Safaricom Daraja public sandbox constants (published by Safaricom;
  # present in pre-template commits in this repository's history)
  'o6tPhH5EoSsGmtLZAG4yMT7b2GQp9e87X3h4T6dk0DuZh2aU',
  'LgJ5V6tShu5SCA9nhcyAA8qrkuq3nHUsbQdmCDRinBIPmjGEY2hVmxo',
  'bfb279f9aa9bdbcf158e97dd71a467cd2e0c893059b10f78e6b72ada1ed2c9',
]
stopwords = [
  'STRIPE_SECRET_KEY',
  'MPESA_CONSUMER_KEY',
  'MPESA_CONSUMER_SECRET',
]
