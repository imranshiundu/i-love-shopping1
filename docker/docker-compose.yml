services:
  postgres:
    image: postgres:16-alpine
    container_name: iloveshopping-postgres
    environment:
      POSTGRES_USER: iloveshopping
      POSTGRES_PASSWORD: iloveshopping
      POSTGRES_DB: iloveshopping
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iloveshopping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - iloveshopping-network

  redis:
    image: redis:7-alpine
    container_name: iloveshopping-redis
    ports:
      - "${REDIS_PORT:-6380}:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - iloveshopping-network

  mailhog:
    image: mailhog/mailhog:latest
    container_name: iloveshopping-mailhog
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_UI_PORT:-8025}:8025"
    networks:
      - iloveshopping-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: iloveshopping-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: iloveshopping
      RABBITMQ_DEFAULT_PASS: iloveshopping
    ports:
      - "${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "${RABBITMQ_UI_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - iloveshopping-network

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: iloveshopping-frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:${API_PORT:-8080}/api/v1
      - BACKEND_INTERNAL_URL=http://api:8080
      - NEXT_PUBLIC_APP_URL=http://localhost:${FRONTEND_PORT:-3000}
      - NEXT_PUBLIC_RECAPTCHA_SITE_KEY=dev-test-site
      - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY:-}
      - NEXT_PUBLIC_APP_NAME=i-love-shopping
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - iloveshopping-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: iloveshopping-api
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DATABASE_URL=jdbc:postgresql://postgres:5432/iloveshopping
      - DATABASE_USER=iloveshopping
      - DATABASE_PASSWORD=iloveshopping
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SERVER_PORT=8080
      - FRONTEND_URL=http://localhost:${FRONTEND_PORT:-3000}
      - CORS_ALLOWED_ORIGINS=http://localhost:${FRONTEND_PORT:-3000}
      - JWT_ACCESS_SECRET=dev-access-secret-min-32-chars-long-for-test
      - JWT_REFRESH_SECRET=dev-refresh-secret-min-32-chars-long-for-test
      - JWT_ACCESS_EXPIRY_MINUTES=15
      - JWT_REFRESH_EXPIRY_DAYS=7
      - RECAPTCHA_SECRET_KEY=dev-test-secret
      - RECAPTCHA_SITE_KEY=dev-test-site
      - GOOGLE_CLIENT_ID=dev-google-id
      - GOOGLE_CLIENT_SECRET=dev-google-secret
      - GITHUB_CLIENT_ID=dev-github-id
      - GITHUB_CLIENT_SECRET=dev-github-secret
      - MAIL_HOST=mailhog
      - MAIL_PORT=1025
      - MAIL_USERNAME=
      - MAIL_PASSWORD=
      - MAIL_FROM=noreply@iloveshopping.com
      - MPESA_CONSUMER_KEY=${MPESA_CONSUMER_KEY:-}
      - MPESA_CONSUMER_SECRET=${MPESA_CONSUMER_SECRET:-}
      - MPESA_SHORTCODE=${MPESA_SHORTCODE:-}
      - MPESA_PASSKEY=${MPESA_PASSKEY:-}
      - MPESA_CALLBACK_URL=${MPESA_CALLBACK_URL:-http://host.docker.internal:${API_PORT:-8080}/api/v1/orders/payments/mpesa/callback}
      - MPESA_BASE_URL=${MPESA_BASE_URL:-https://sandbox.safaricom.co.ke}
      - MPESA_STK_TIMEOUT_SECONDS=${MPESA_STK_TIMEOUT_SECONDS:-120}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=iloveshopping
      - RABBITMQ_PASSWORD=iloveshopping
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - iloveshopping-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:

networks:
  iloveshopping-network:
    driver: bridge